<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real For Real Apparel</title>
<style>
  :root {
    --black: #000;
    --white: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #enter-screen {
    position: fixed;
    inset: 0;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #enter-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #enter-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.6);
    color: var(--white);
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 500;
    letter-spacing: 0.45em;
    padding: 1.1rem 2.8rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.35s ease;
  }
  #enter-btn:hover {
    background: var(--white);
    color: var(--black);
    border-color: var(--white);
  }
  #experience {
    position: fixed;
    inset: 0;
    background: var(--black);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease;
  }
  #experience.show {
    opacity: 1;
    visibility: visible;
  }
  #panels {
    position: absolute;
    inset: 0;
    display: flex;
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #panels.hide {
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
  }
  .panel {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .panel video {
    position: absolute;
    top: 0;
    height: 100%;
    width: 300%;
    object-fit: cover;
    pointer-events: none;
  }
  .panel:nth-child(1) video { left: 0; }
  .panel:nth-child(2) video { left: -100%; }
  .panel:nth-child(3) video { left: -200%; }
  #joined {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: all 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #joined.show {
    opacity: 1;
    pointer-events: auto;
  }
  #joined.shifted {
    left: 52%;
    width: 48%;
  }
  #main-video {
    height: 88vh;
    max-width: 92%;
    object-fit: contain;
    border-radius: 6px;
    transition: all 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #joined.shifted #main-video {
    height: 72vh;
  }
  #website {
    position: absolute;
    top: 0;
    left: 0;
    width: 52%;
    height: 100%;
    background: var(--black);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 2rem;
    opacity: 0;
    transform: translateX(-30px);
    pointer-events: none;
    transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #website.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  #website h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 500;
    letter-spacing: 0.12em;
    margin-bottom: 0.6rem;
  }
  #website p {
    font-size: 1.15rem;
    opacity: 0.75;
    margin-bottom: 2.2rem;
  }
  #website a {
    display: inline-block;
    background: var(--white);
    color: var(--black);
    padding: 0.95rem 2.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-decoration: none;
    text-transform: uppercase;
    transition: transform 0.3s ease;
  }
  #website a:hover {
    transform: scale(1.04);
  }
  @media (max-width: 900px) {
    #website { width: 100%; }
    #joined.shifted {
      left: 0;
      width: 100%;
      top: 38%;
      height: 62%;
    }
    #joined.shifted #main-video { height: 48vh; }
    #main-video { height: 70vh; }
  }
</style>
</head>
<body>
  <div id="enter-screen">
    <button id="enter-btn">Enter</button>
  </div>

  <div id="experience">
    <div id="panels">
      <div class="panel"><video muted playsinline loop preload="auto"></video></div>
      <div class="panel"><video muted playsinline loop preload="auto"></video></div>
      <div class="panel"><video muted playsinline loop preload="auto"></video></div>
    </div>

    <div id="joined">
      <video id="main-video" playsinline preload="auto">
        <source src="promo.mp4" type="video/mp4">
      </video>
    </div>

    <div id="website">
      <h1>REAL FOR REAL</h1>
      <p>Choose the rest</p>
      <a href="https://mrbhnco.com/" target="_blank" rel="noopener">mrbhnco.com</a>
    </div>
  </div>

<script>
  const enterScreen = document.getElementById('enter-screen');
  const enterBtn = document.getElementById('enter-btn');
  const experience = document.getElementById('experience');
  const panels = document.getElementById('panels');
  const splitVideos = document.querySelectorAll('#panels video');
  const joined = document.getElementById('joined');
  const mainVideo = document.getElementById('main-video');
  const website = document.getElementById('website');

  splitVideos.forEach(v => { v.src = 'promo.mp4'; });

  enterBtn.addEventListener('click', () => {
    enterScreen.classList.add('hide');
    setTimeout(() => {
      experience.classList.add('show');
      splitVideos.forEach(v => v.play().catch(() => {}));
      setTimeout(join, 7000);
    }, 700);
  });

  function join() {
    panels.classList.add('hide');
    setTimeout(() => {
      joined.classList.add('show');
      mainVideo.currentTime = 7;
      mainVideo.play().catch(() => {});
      setTimeout(revealSite, 22000);
    }, 700);
  }

  function revealSite() {
    joined.classList.add('shifted');
    website.classList.add('show');
  }

  mainVideo.addEventListener('ended', revealSite);
</script>
</body>
</html>
