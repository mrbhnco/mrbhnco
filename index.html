<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real For Real Apparel</title>
<style>
  :root {
    --black: #000;
    --white: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* ENTER */
  #enter-screen {
    position: fixed;
    inset: 0;
    background: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #enter-screen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #enter-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.6);
    color: var(--white);
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 500;
    letter-spacing: 0.45em;
    padding: 1.1rem 2.8rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.35s ease;
  }
  #enter-btn:hover {
    background: var(--white);
    color: var(--black);
    border-color: var(--white);
  }

  /* VIDEO EXPERIENCE */
  #experience {
    position: fixed;
    inset: 0;
    background: var(--black);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, filter 1.2s ease;
  }
  #experience.show { opacity: 1; visibility: visible; }
  #experience.blur-out { filter: blur(12px); opacity: 0; }

  #panels {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    transition: opacity 1s ease, transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #panels.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }

  .panel {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .panel video {
    position: absolute;
    left: 0;
    width: 100%;
    height: 300%;
    object-fit: cover;
    pointer-events: none;
  }
  .panel:nth-child(1) video { top: 0; }
  .panel:nth-child(2) video { top: -100%; }
  .panel:nth-child(3) video { top: -200%; }

  #joined {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #joined.show { opacity: 1; pointer-events: auto; }
  #main-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* STORE */
  #store {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    opacity: 0;
    filter: blur(12px);
    pointer-events: none;
    transition: opacity 1.2s ease, filter 1.2s ease;
    z-index: 500;
  }
  #store.show {
    opacity: 1;
    filter: blur(0);
    pointer-events: auto;
  }
  #store h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 500;
    letter-spacing: 0.12em;
    margin-bottom: 1rem;
  }
  #store p {
    font-size: 1.15rem;
    opacity: 0.75;
    margin-bottom: 2rem;
  }
  #store a {
    display: inline-block;
    background: var(--white);
    color: var(--black);
    padding: 1rem 2.6rem;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-decoration: none;
    text-transform: uppercase;
    transition: transform 0.3s ease;
  }
  #store a:hover { transform: scale(1.04); }
</style>
</head>
<body>

  <div id="enter-screen">
    <button id="enter-btn">Enter</button>
  </div>

  <div id="experience">
    <div id="panels">
      <div class="panel"><video muted playsinline loop preload="auto"></video></div>
      <div class="panel"><video muted playsinline loop preload="auto"></video></div>
      <div class="panel"><video muted playsinline loop preload="auto"></video></div>
    </div>
    <div id="joined">
      <video id="main-video" playsinline preload="auto">
        <source src="Download.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <div id="store">
    <h1>REAL FOR REAL</h1>
    <p>Welcome to the store</p>
    <a href="https://mrbhnco.com/" target="_blank" rel="noopener">Shop Now</a>
  </div>

<script>
  const enterScreen = document.getElementById('enter-screen');
  const enterBtn = document.getElementById('enter-btn');
  const experience = document.getElementById('experience');
  const panels = document.getElementById('panels');
  const splitVideos = document.querySelectorAll('#panels video');
  const joined = document.getElementById('joined');
  const mainVideo = document.getElementById('main-video');
  const store = document.getElementById('store');

  const videoSrc = 'Download.mp4';
  splitVideos.forEach(v => { v.src = videoSrc; });
  mainVideo.querySelector('source').src = videoSrc;
  mainVideo.load();

  enterBtn.addEventListener('click', () => {
    enterScreen.classList.add('hide');
    setTimeout(() => {
      experience.classList.add('show');
      splitVideos.forEach(v => v.play().catch(() => {}));
      setTimeout(joinFull, 4000);
    }, 600);
  });

  function joinFull() {
    panels.classList.add('hide');
    setTimeout(() => {
      joined.classList.add('show');
      mainVideo.currentTime = 4;
      mainVideo.play().catch(() => {});
    }, 600);
  }

  mainVideo.addEventListener('ended', () => {
    experience.classList.add('blur-out');
    setTimeout(() => {
      store.classList.add('show');
    }, 400);
  });
</script>
</body>
</html>
