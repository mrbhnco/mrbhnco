<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRBHNCO</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.brand{margin:28px 0 24px;font-size:clamp(32px,5vw,52px);font-weight:900;letter-spacing:.18em;text-align:center}

</style>
</head>

<div class="brand">MRBHNCO</div>
<div class="video-wrap">
<video controls autoplay muted loop playsinline preload="metadata">
<source src="/vid.mp4" type="video/mp4">
</video>
</div>
</body>
</html>
