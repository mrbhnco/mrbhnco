```html
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MRBHNCO</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

/* Top-center brand */
header {
  width: 100%;
  padding: 28px 20px;
  text-align: center;
}

.brand {
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 900;
  letter-spacing: 0.18em;
}

/* Video at top-right */
main {
  width: 100%;
  display: flex;
  justify-content: flex-end;
  align-items: flex-start;
  padding: 10px 40px 40px;
}

.video-wrap {
  width: min(50vw, 760px);
}

video {
  display: block;
  width: 100%;
  height: auto;
  max-height: 80vh;
  object-fit: contain;
  background: #000;
}

/* Mobile */
@media (max-width: 768px) {
  header {
    padding: 22px 16px 18px;
  }

  main {
    justify-content: center;
    padding: 10px 18px 40px;
  }

  .video-wrap {
    width: 100%;
  }

  video {
    max-height: none;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">MRBHNCO</div>
</header>

<main>
  <div class="video-wrap">
    <video controls autoplay muted loop playsinline preload="metadata">
      <source src="/vid.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>
  </div>
</main>

</body>
</html>
