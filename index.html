<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRBHNCO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.page{width:100vw;height:100vh;display:flex;justify-content:space-between}
.left{height:100vh;flex:1;overflow-y:auto;padding:24px 28px 40px}
.brand{text-align:center;color:#00a651;font-size:clamp(32px,5vw,52px);font-weight:900;letter-spacing:.18em;margin:0 0 28px}
.label{text-align:center;font-size:14px;text-transform:uppercase;letter-spacing:.15em;font-weight:700;margin-bottom:14px}
.shirts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;margin:0 auto}
.shirt-btn{background:#111;color:#fff;border:1px solid #555;border-radius:8px;padding:13px 10px;font-size:15px;font-weight:700;cursor:pointer}
.shirt-btn:hover{border-color:#ff0000;color:#ff0000}
.shirt-btn.active{background:#ff0000;color:#fff;border-color:#ff0000}
.cart{max-width:620px;margin:26px auto 0;padding-top:20px;border-top:1px solid #333}
.subtotal-row{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:800;margin-bottom:14px}
.pay-btn{width:100%;border:0;border-radius:8px;padding:15px;background:#ff0000;color:#fff;font-size:18px;font-weight:900;cursor:pointer}
.pay-btn:disabled{opacity:.4;cursor:not-allowed}

.video-side{
height:100vh;
width:min(42vw,70vh);
flex:none;
background:#000;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

video{
display:block;
width:auto;
height:100%;
max-width:100%;
object-fit:contain;
object-position:center;
background:#000
}

.checkout{display:none;min-height:100vh;padding:28px;overflow-y:auto}
.checkout.show{display:block}
.checkout-inner{max-width:620px;margin:0 auto}
.checkout h1{color:#ff0000;text-align:center;margin:0 0 28px;font-size:clamp(30px,5vw,48px)}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:7px;font-weight:700}
.form-group input{width:100%;padding:14px;border:1px solid #555;border-radius:7px;background:#111;color:#fff;font-size:16px}
.form-actions{display:flex;gap:10px;margin-top:22px}
.back-btn{flex:1;padding:14px;border:1px solid #555;border-radius:7px;background:#111;color:#fff;font-weight:800;cursor:pointer}
.confirm-btn{flex:1;padding:14px;border:0;border-radius:7px;background:#ff0000;color:#fff;font-weight:900;cursor:pointer}
.order-total{text-align:right;font-size:20px;font-weight:800;margin-top:20px}

@media(max-width:768px){
.left{padding:18px 12px 30px}
.brand{font-size:clamp(24px,7vw,38px);letter-spacing:.12em;margin-bottom:20px}
.label{font-size:11px}
.shirts{grid-template-columns:1fr;gap:7px}
.shirt-btn{padding:11px 6px;font-size:12px}
.cart{margin-top:18px}
.subtotal-row{font-size:18px}
.video-side{width:min(56.25vh,50vw)}
.checkout{padding:20px 14px}
}
</style>
</head>

<body>

<main id="shop" class="page">

<section class="left">

<div class="brand">MRBHNCO</div>

<div class="label">Choose Your Shirt</div>

<div class="shirts">

<button class="shirt-btn" data-shirt="Shirt 1">SHIRT 1</button>
<button class="shirt-btn" data-shirt="Shirt 2">SHIRT 2</button>
<button class="shirt-btn" data-shirt="Shirt 3">SHIRT 3</button>
<button class="shirt-btn" data-shirt="Shirt 4">SHIRT 4</button>
<button class="shirt-btn" data-shirt="Shirt 5">SHIRT 5</button>
<button class="shirt-btn" data-shirt="Shirt 6">SHIRT 6</button>
<button class="shirt-btn" data-shirt="Shirt 7">SHIRT 7</button>
<button class="shirt-btn" data-shirt="Shirt 8">SHIRT 8</button>
<button class="shirt-btn" data-shirt="Shirt 9">SHIRT 9</button>
<button class="shirt-btn" data-shirt="Shirt 10">SHIRT 10</button>
<button class="shirt-btn" data-shirt="Shirt 11">SHIRT 11</button>
<button class="shirt-btn" data-shirt="Shirt 12">SHIRT 12</button>
<button class="shirt-btn" data-shirt="Shirt 13">SHIRT 13</button>
<button class="shirt-btn" data-shirt="Shirt 14">SHIRT 14</button>
<button class="shirt-btn" data-shirt="Shirt 15">SHIRT 15</button>
<button class="shirt-btn" data-shirt="Shirt 16">SHIRT 16</button>
<button class="shirt-btn" data-shirt="Shirt 17">SHIRT 17</button>
<button class="shirt-btn" data-shirt="Shirt 18">SHIRT 18</button>
<button class="shirt-btn" data-shirt="Shirt 19">SHIRT 19</button>
<button class="shirt-btn" data-shirt="Shirt 20">SHIRT 20</button>

</div>

<div class="cart">

<div class="subtotal-row">
<span>Subtotal</span>
<span id="subtotal">$0.00</span>
</div>

<button id="pay" class="pay-btn" disabled>
PAY / CHECKOUT
</button>

</div>

</section>


<section class="video-side">

<video id="siteVideo" autoplay muted loop playsinline preload="auto">

<!-- NEW VIDEO -->
<source src="/video5.MOV" type="video/quicktime">

</video>

</section>

</main>


<section id="checkout" class="checkout">

<div class="checkout-inner">

<h1>SHIPPING</h1>

<form id="shippingForm">

<div class="form-group">
<label for="name">Full Name</label>
<input id="name" name="name" required autocomplete="name">
</div>

<div class="form-group">
<label for="address">Street Address</label>
<input id="address" name="address" required autocomplete="street-address">
</div>

<div class="form-group">
<label for="city">City</label>
<input id="city" name="city" required autocomplete="address-level2">
</div>

<div class="form-group">
<label for="state">State</label>
<input id="state" name="state" required autocomplete="address-level1">
</div>

<div class="form-group">
<label for="zip">ZIP Code</label>
<input id="zip" name="zip" required autocomplete="postal-code">
</div>

<div class="order-total">
Subtotal: <span id="checkoutTotal">$0.00</span>
</div>

<div class="form-actions">

<button type="button" id="back" class="back-btn">
BACK
</button>

<button type="submit" class="confirm-btn">
CONTINUE TO PAYMENT
</button>

</div>

</form>

</div>

</section>


<script>

const buttons=document.querySelectorAll('.shirt-btn');
const subtotal=document.getElementById('subtotal');
const pay=document.getElementById('pay');
const shop=document.getElementById('shop');
const checkout=document.getElementById('checkout');
const checkoutTotal=document.getElementById('checkoutTotal');
const back=document.getElementById('back');
const form=document.getElementById('shippingForm');

let selected=false;

const siteVideo=document.getElementById('siteVideo');

const startVideo=()=>{
const p=siteVideo.play();
if(p&&p.catch)p.catch(()=>{});
};

const enableSound=()=>{
siteVideo.muted=false;
siteVideo.volume=1;
const p=siteVideo.play();
if(p&&p.catch)p.catch(()=>{});
};

startVideo();

siteVideo.addEventListener('loadeddata',startVideo,{once:true});
siteVideo.addEventListener('canplay',startVideo,{once:true});

['click','touchstart','pointerdown','keydown'].forEach(event=>
document.addEventListener(event,enableSound,{once:true,passive:true})
);

buttons.forEach(button=>button.addEventListener('click',()=>{

buttons.forEach(b=>b.classList.remove('active'));

button.classList.add('active');

selected=true;

subtotal.textContent='$30.00';

pay.disabled=false;

}));

pay.addEventListener('click',()=>{

if(!selected)return;

checkoutTotal.textContent=subtotal.textContent;

shop.style.display='none';

checkout.classList.add('show');

});

back.addEventListener('click',()=>{

checkout.classList.remove('show');

shop.style.display='flex';

});

form.addEventListener('submit',e=>{

e.preventDefault();

alert('Shipping information saved. Payment processing will be connected next.');

});

</script>

</body>
</html>
