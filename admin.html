<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRBHNCO Admin – Direct Update</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0612;color:#e4c56a;font-family:Arial,Helvetica,sans-serif}
.settings{background:#100b19;padding:12px;border-bottom:1px solid #333;font-size:14px}
.settings input{margin:4px 6px 4px 0;padding:6px;border-radius:4px;border:1px solid #6b5a2c;background:#07040f;color:#fff;width:180px}
.header{background:#100b19;padding:16px 24px;border-bottom:1px solid #e4c56a;display:flex;justify-content:space-between;align-items:center}
.btn{border:1px solid #e4c56a;background:#181126;color:#e4c56a;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.primary{background:#e4c56a;color:#000}
.main{display:flex;height:calc(100vh - 140px)}
.preview{flex:1;padding:20px;overflow:auto;background:#000}
.preview-inner{max-width:900px;margin:0 auto;background:#000;color:#fff;border:1px dashed #444;padding:16px}
.clickable{cursor:pointer;outline:2px dashed transparent;position:relative}
.clickable:hover{outline:2px dashed #e4c56a}
.brand{text-align:center;margin:0 0 16px;min-height:60px;display:flex;align-items:center;justify-content:center;background:#111;border-radius:8px}
.product-card{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin:0 auto 16px;max-width:640px}
.product-top{display:flex;gap:12px}
.product-image{width:180px;background:#fff;border-radius:8px;overflow:hidden}
.product-image img{width:100%;height:auto;display:block}
.price{color:#ffd700;font-weight:700}
.editor{width:380px;background:#100b19;padding:20px;overflow-y:auto}
.notice{font-size:12px;color:#cbb89a;margin-top:8px}
</style>
</head>
<body>
<div class="settings">
  <strong>GitHub settings:</strong><br>
  Token: <input id="ghToken" type="password" placeholder="paste ghp_ token here">
  Owner: <input id="ghOwner" value="mrbhnco">
  Repo: <input id="ghRepo" value="mrbhnco">
  Path: <input id="ghPath" value="index.html">
  Branch: <input id="ghBranch" value="main">
</div>
<div class="header">
  <h1>MRBHNCO Admin</h1>
  <button class="btn primary" id="submitBtn">Submit Changes (Push to Live Site)</button>
</div>
<div class="main">
  <div class="preview">
    <div class="preview-inner">
      <div class="brand clickable" data-section="logo" id="prevLogo">
        <span style="font-size:28px;font-weight:900;letter-spacing:.1em;background:linear-gradient(90deg,#ff6b35,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent">MRBHNCO</span>
      </div>
      <div class="product-card clickable" data-section="bikini">
        <div class="product-top">
          <div class="product-image"><img id="prevBikiniImg" src="https://via.placeholder.com/180x220/111/fff?text=Bikini"></div>
          <div>
            <h2 id="prevBikiniName">Bikini</h2>
            <div class="price" id="prevBikiniPrice">$50.00</div>
            <div>In stock: <span id="prevBikiniStock">42</span></div>
          </div>
        </div>
      </div>
      <div class="product-card clickable" data-section="tracksuit">
        <div class="product-top">
          <div class="product-image"><img id="prevTrackImg" src="https://via.placeholder.com/180x220/111/fff?text=Tracksuit"></div>
          <div>
            <h2 id="prevTrackName">Tracksuit</h2>
            <div class="price" id="prevTrackPrice">$50.00</div>
            <div>In stock: <span id="prevTrackStock">28</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="editor">
    <h2>How to edit</h2>
    <p class="notice">Click any section on the left. Make changes, then click Submit Changes.</p>
    <div id="status" class="notice"></div>
  </div>
</div>
<script>
const data = {
  logo: { text: 'MRBHNCO', image: '' },
  bikini: { name: 'Bikini', price: '50.00', stock: '42', image: '' },
  tracksuit: { name: 'Tracksuit', price: '50.00', stock: '28', image: '' },
  shipping: { std: '5.99', pri: '10.99' }
};
function updatePreview() {
  document.getElementById('prevBikiniName').textContent = data.bikini.name;
  document.getElementById('prevBikiniPrice').textContent = '$' + data.bikini.price;
  document.getElementById('prevBikiniStock').textContent = data.bikini.stock;
  document.getElementById('prevTrackName').textContent = data.tracksuit.name;
  document.getElementById('prevTrackPrice').textContent = '$' + data.tracksuit.price;
  document.getElementById('prevTrackStock').textContent = data.tracksuit.stock;
}
document.getElementById('submitBtn').onclick = async () => {
  const token = document.getElementById('ghToken').value.trim();
  const owner = document.getElementById('ghOwner').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const path = document.getElementById('ghPath').value.trim() || 'index.html';
  const branch = document.getElementById('ghBranch').value.trim() || 'main';
  if (!token) { alert('Paste the token first'); return; }
  document.getElementById('status').textContent = 'Pushing...';
  const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, {
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
  });
  let sha = null;
  if (getRes.ok) sha = (await getRes.json()).sha;
  const html = `<!DOCTYPE html><html><head><title>MRBHNCO</title></head><body><h1>Updated from admin</h1></body></html>`;
  const content = btoa(unescape(encodeURIComponent(html)));
  const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: 'Update from admin', content, sha, branch })
  });
  if (putRes.ok) document.getElementById('status').textContent = 'Success! Site will update soon.';
  else document.getElementById('status').textContent = 'Error: ' + (await putRes.json()).message;
};
updatePreview();
</script>
</body>
</html>
