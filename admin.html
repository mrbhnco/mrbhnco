<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MRBHNCO Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0a0612;color:#fff;font-family:Arial,Helvetica,sans-serif}
.settings{background:#100b19;padding:9px 12px;border-bottom:1px solid #333;font-size:13px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.settings input{padding:6px;border:1px solid #6b5a2c;border-radius:4px;background:#07040f;color:#fff;width:145px}.settings .path{width:170px}.settings .branch{width:100px}
.header{background:#100b19;padding:12px 20px;border-bottom:1px solid #e4c56a;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.header h1{margin:0;font-size:18px;color:#e4c56a}
.btn{border:1px solid #e4c56a;background:#181126;color:#e4c56a;padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:700}.btn.primary{background:#e4c56a;color:#000}.btn.small{padding:6px 10px;font-size:12px}
.main{padding:18px;max-width:1100px;margin:auto}.preview{background:#000;border:1px dashed #444;border-radius:8px;padding:12px}
.brand{text-align:center;margin:0 0 12px;min-height:54px;display:flex;align-items:center;justify-content:center;background:#111;border-radius:8px;overflow:hidden}.brand img{max-width:100%;max-height:110px}
.clickable{cursor:pointer;outline:2px dashed transparent;position:relative}.clickable:hover{outline:2px dashed #e4c56a}.clickable::after{content:'✎';position:absolute;top:2px;right:2px;background:#e4c56a;color:#000;font-size:10px;padding:1px 4px;border-radius:3px;opacity:0}.clickable:hover::after{opacity:1}
.product-card{background:#111;border:1px solid #333;border-radius:10px;padding:10px;margin:0 auto 12px;max-width:720px}.product-top{display:flex;gap:14px}.product-image{width:190px;height:190px;background:#fff;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}.product-image img{width:100%;height:100%;object-fit:contain;display:block}.product-info{flex:1;padding-top:5px}.product-info h2{margin:0 0 6px;font-size:20px}.price{color:#ffd700;font-size:18px;font-weight:700}.stock{font-size:13px;color:#ddd;margin-top:5px}
.section-row{padding:8px;border:1px dashed #444;border-radius:6px;margin-top:8px;text-align:center;font-size:13px}.add-section{text-align:center;margin:16px 0}
.status{min-height:20px;margin-top:10px;color:#e4c56a;font-size:12px}.note{color:#cbb89a;font-size:12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:center;justify-content:center}.modal-bg.show{display:flex}.modal{background:#100b19;border:1px solid #e4c56a;border-radius:12px;padding:16px;width:420px;max-width:95vw}.close{float:right;cursor:pointer;font-size:20px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input{width:100%;padding:8px;border:1px solid #6b5a2c;border-radius:6px;background:#07040f;color:#fff}.actions{text-align:right;margin-top:14px}
.loading{opacity:.6;pointer-events:none}@media(max-width:650px){.settings input{width:100%}.product-top{flex-direction:column}.product-image{width:100%;height:auto}.product-image img{height:auto;max-height:360px}}
</style>
</head>
<body>
<div class="settings"><strong>GitHub</strong>
<input id="ghToken" type="password" placeholder="ghp_..."><input id="ghOwner" value="mrbhnco"><input id="ghRepo" value="mrbhnco">
<input id="ghPath" class="path" value="index.html"><input id="ghBranch" class="branch" value="main"><button class="btn small" id="saveSettings">Save</button></div>
<div class="header"><h1>MRBHNCO Admin</h1><button class="btn primary" id="submitBtn">Submit Changes</button></div>
<main class="main" id="adminMain">
<div class="preview" id="preview">
<div class="brand clickable" id="prevLogo"></div><div id="productsContainer"></div>
<div class="add-section"><button class="btn" id="addProductBtn">+ Add Product Tile</button></div>
<div class="section-row clickable" id="prevShipping">Shipping: Standard $<span id="prevShipStd"></span> · Priority $<span id="prevShipPri"></span></div>
<div class="section-row clickable" id="prevVideo">Video: <span id="prevVideoSrc"></span></div>
<p class="note">This admin loads the current index.html from GitHub. Saving prices patches only the matching product fields in that current file, so the rest of the storefront is preserved.</p>
<div class="status" id="status"></div>
</div></main>
<div class="modal-bg" id="modalBg"><div class="modal"><span class="close" id="modalClose">&times;</span><h3 id="modalTitle">Edit</h3><div id="modalBody"></div><div class="actions"><button class="btn" id="modalCancel">Cancel</button> <button class="btn primary" id="modalSave">Save</button></div></div></div>
<script>
let data={logo:{text:'MRBHNCO',image:'',imageChanged:false},products:[],shipping:{std:'5.99',pri:'10.99'},video:{main:'/video5.mp4',thumb1:'r4r.png',thumb1Src:'/video5.mp4',thumb2:'mark.png',thumb2Src:'vid.mp4'}};
let section=null,productId=null;
const $=id=>document.getElementById(id);
function settings(){['token','owner','repo','path','branch'].forEach(k=>{const v=localStorage.getItem('mrbhnco_'+k);if(v)$('gh'+k[0].toUpperCase()+k.slice(1)).value=v})}
function saveSettings(){['token','owner','repo','path','branch'].forEach(k=>localStorage.setItem('mrbhnco_'+k,$('gh'+k[0].toUpperCase()+k.slice(1)).value.trim()));$('status').textContent='Settings saved.'}
$('saveSettings').onclick=saveSettings;$('ghToken').onchange=saveSettings;
function api(){const o=encodeURIComponent($('ghOwner').value.trim()),r=encodeURIComponent($('ghRepo').value.trim()),p=$('ghPath').value.trim()||'index.html',b=encodeURIComponent($('ghBranch').value.trim()||'main');return 'https://api.github.com/repos/'+o+'/'+r+'/contents/'+p+'?ref='+b}
function dec(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function url(s){try{return new URL(s,location.href).href}catch{return s}}
function readIndex(html){
 const d=new DOMParser().parseFromString(html,'text/html'),logo=d.querySelector('.brand img');data.logo.image=logo?.src||'';data.logo.text=logo?.alt||'MRBHNCO';
 data.products=[...d.querySelectorAll('.product-card')].map((c,i)=>{const b=c.querySelector('.add-btn'),img=c.querySelector('.product-image img');return{id:b?.dataset.product||img?.id?.replace(/Image$/,'')||'product'+i,name:c.querySelector('.product-details h2')?.textContent.trim()||'',price:(c.querySelector('.price')?.textContent||'').replace(/[^0-9.]/g,''),stock:(c.querySelector('.stock')?.textContent||'').replace(/[^0-9.]/g,''),image:img?.getAttribute('src')||''}})
 const ships=d.querySelectorAll('.ship');data.shipping.std=ships[0]?.dataset.cost||data.shipping.std;data.shipping.pri=ships[1]?.dataset.cost||data.shipping.pri;
 data.video.main=d.querySelector('#siteVideo source')?.getAttribute('src')||data.video.main;const t=d.querySelectorAll('.video-thumb');if(t[0]){data.video.thumb1=t[0].querySelector('img')?.getAttribute('src')||'';data.video.thumb1Src=t[0].dataset.src||''}if(t[1]){data.video.thumb2=t[1].querySelector('img')?.getAttribute('src')||'';data.video.thumb2Src=t[1].dataset.src||''}
}
function render(){
 $('prevLogo').innerHTML=data.logo.image?'<img src="'+url(data.logo.image)+'" alt="MRBHNCO">':'<b style="font-size:24px;letter-spacing:.1em">'+data.logo.text+'</b>';
 $('prevShipStd').textContent=data.shipping.std;$('prevShipPri').textContent=data.shipping.pri;$('prevVideoSrc').textContent=data.video.main;
 $('productsContainer').innerHTML='';data.products.forEach(p=>{const c=document.createElement('div');c.className='product-card clickable';c.innerHTML='<div class="product-top"><div class="product-image"><img src="'+url(p.image)+'" alt="'+p.name+'"></div><div class="product-info"><h2>'+p.name+'</h2><div class="price">$'+p.price+'</div><div class="stock">In stock: '+p.stock+'</div></div></div>';c.onclick=()=>open('product',p.id);$('productsContainer').appendChild(c)})
}
async function load(){const t=$('ghToken').value.trim();if(!t){$('status').textContent='Enter your GitHub token, then click Save.';return} $('status').textContent='Loading current index.html...';const r=await fetch(api(),{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});if(!r.ok){$('status').textContent='GitHub error: '+(await r.json()).message;return}const j=await r.json();readIndex(dec(j.content));render();$('status').textContent='Loaded current index.html.'}
function open(s,id){section=s;productId=id||null;const b=$('modalBody');b.innerHTML='';
 if(s==='product'){const p=data.products.find(x=>x.id===id);$('modalTitle').textContent='Edit Product';b.innerHTML='<div class="field"><label>Name</label><input id="fName" value="'+p.name.replace(/"/g,'&quot;')+'"></div><div class="field"><label>Price</label><input id="fPrice" type="number" step="0.01" value="'+p.price+'"></div><div class="field"><label>Stock</label><input id="fStock" type="number" value="'+p.stock+'"></div><div class="field"><label>Image</label><input id="fFile" type="file" accept="image/*"></div>'}
 if(s==='logo'){ $('modalTitle').textContent='Edit Logo';b.innerHTML='<div class="field"><label>Text</label><input id="fText" value="'+data.logo.text+'"></div><div class="field"><label>Upload image</label><input id="fFile" type="file" accept="image/*"></div>'}
 if(s==='shipping'){ $('modalTitle').textContent='Edit Shipping';b.innerHTML='<div class="field"><label>Standard</label><input id="fStd" type="number" step="0.01" value="'+data.shipping.std+'"></div><div class="field"><label>Priority</label><input id="fPri" type="number" step="0.01" value="'+data.shipping.pri+'"></div>'}
 if(s==='video'){ $('modalTitle').textContent='Edit Video';b.innerHTML='<div class="field"><label>Main video</label><input id="fMain" value="'+data.video.main+'"></div><div class="field"><label>Thumb 1 image</label><input id="fThumb1" value="'+data.video.thumb1+'"></div><div class="field"><label>Thumb 1 video</label><input id="fThumb1Src" value="'+data.video.thumb1Src+'"></div><div class="field"><label>Thumb 2 image</label><input id="fThumb2" value="'+data.video.thumb2+'"></div><div class="field"><label>Thumb 2 video</label><input id="fThumb2Src" value="'+data.video.thumb2Src+'"></div>'}
 $('modalBg').classList.add('show')}
function close(){ $('modalBg').classList.remove('show');section=null;productId=null}
$('modalClose').onclick=close;$('modalCancel').onclick=close;$('modalBg').onclick=e=>{if(e.target.id==='modalBg')close()};
$('modalSave').onclick=()=>{if(section==='product'){const p=data.products.find(x=>x.id===productId);p.name=$('fName').value||p.name;p.price=$('fPrice').value||p.price;p.stock=$('fStock').value||p.stock;const f=$('fFile')?.files[0];if(f){const r=new FileReader();r.onload=e=>{p.image=e.target.result;p.imageChanged=true;render()};r.readAsDataURL(f)}render()}
if(section==='logo'){data.logo.text=$('fText').value||data.logo.text;const f=$('fFile')?.files[0];if(f){const r=new FileReader();r.onload=e=>{data.logo.image=e.target.result;data.logo.imageChanged=true;render()};r.readAsDataURL(f)}}
if(section==='shipping'){data.shipping.std=$('fStd').value;data.shipping.pri=$('fPri').value}
if(section==='video'){data.video.main=$('fMain').value||data.video.main;data.video.thumb1=$('fThumb1').value||data.video.thumb1;data.video.thumb1Src=$('fThumb1Src').value||data.video.thumb1Src;data.video.thumb2=$('fThumb2').value||data.video.thumb2;data.video.thumb2Src=$('fThumb2Src').value||data.video.thumb2Src}
close();$('status').textContent='Change ready. Click Submit Changes.'};
$('prevLogo').onclick=()=>open('logo');$('prevShipping').onclick=()=>open('shipping');$('prevVideo').onclick=()=>open('video');
$('addProductBtn').onclick=()=>alert('This safe admin edits the products already on the current storefront. It does not rebuild index.html.');
function patchProduct(html,p){
 const marker='data-product="'+p.id+'"',pos=html.indexOf(marker);if(pos<0)return html;let start=html.lastIndexOf('<div class="product-card">',pos);if(start<0)return html;let next=html.indexOf('<div class="product-card">',pos+marker.length);let end=next>0?next:html.indexOf('<div class="cart">',pos);if(end<0)end=html.length;let b=html.slice(start,end);
 b=b.replace(/(<h2>)[^<]*(<\/h2>)/,'$1'+p.name+'$2').replace(/(<div class="price">)\$[^<]*(<\/div>)/,'$1$'+p.price+'$2').replace(/(<div class="stock">)In stock:\s*[^<]*(<\/div>)/,'$1In stock: '+p.stock+'$2').replace(/(data-price=")[^"]*(")/,'$1'+p.price+'$2');
 if(p.imageChanged)b=b.replace(new RegExp('(<img[^>]*id="'+p.id+'Image"[^>]*src=")[^"]*(")'),'$1'+p.image+'$2');
 return html.slice(0,start)+b+html.slice(end)
}
$('submitBtn').onclick=async()=>{
 const t=$('ghToken').value.trim();if(!t){alert('Paste the GitHub token first.');return}$('adminMain').classList.add('loading');$('status').textContent='Fetching the latest index.html before saving...';
 try{
  const r=await fetch(api(),{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error((await r.json()).message);const j=await r.json();let html=dec(j.content);
  data.products.forEach(p=>{html=patchProduct(html,p)});
  if(data.video.main){html=html.replace(/(<source src=")[^"]*(" type="video\/mp4">)/,'$1'+data.video.main+'$2')}
  const putUrl='https://api.github.com/repos/'+encodeURIComponent($('ghOwner').value.trim())+'/'+encodeURIComponent($('ghRepo').value.trim())+'/contents/'+($('ghPath').value.trim()||'index.html');
  const put=await fetch(putUrl,{method:'PUT',headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Update storefront from admin safely',content:enc(html),sha:j.sha,branch:$('ghBranch').value.trim()||'main'})});
  if(!put.ok)throw new Error((await put.json()).message);$('status').textContent='Saved. Only the requested fields were patched into the latest index.html.';readIndex(html);render();
 }catch(e){$('status').textContent='Error: '+e.message}finally{$('adminMain').classList.remove('loading')}
};
settings();load();
</script>
</body>
</html>
